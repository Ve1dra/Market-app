name: Keep Render Alive
on: 
  schedule:
    - cron: '*/14 * * * *'
  jobs: 
    ping:
      runs-on: ubuntu-latest
      steps: 
        - name: Wake up API
          run: |
            for i in {1..3}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://market-app-xa3g.onrender.com/)
              echo "Attempt $i: HTTP $STATUS"
              [ "$STATUS" -eq 200 ] && break
            done